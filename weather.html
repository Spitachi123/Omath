<style>

.sm{background:var(--al);border:2px dashed var(--a);border-radius:18px;padding:16px;max-height:0;opacity:0;overflow:hidden;padding-block:0;transition:all .7s}.sm.sh{max-height:300px;opacity:1;padding-block:16px;margin-top:12px}

.vc{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--sh);opacity:0;transform:scale(.8)}.vg.show .vc{animation:up .5s both;animation-delay:calc(var(--i)*.1s)}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ST=[
{t:"Stanza 1 · The Joy of Spring",sum:"Stanza 1 celebrates spring as a season of renewal and togetherness. The cuckoo’s arrival, gentle showers, young birds taking flight and the nightingale’s song show nature coming alive, while people gather outdoors, wear light dresses and dream of sunny holidays. The refrain ‘And so do I’ shows the speaker sharing this joy, so spring stands for youth, hope, growth and social warmth.",sym:"Spring = youth, hope, growth, social connection and renewal.",
pairs:[[["This is the weather the cuckoo likes,","And so do I;"],"The poem opens with the arrival of spring, a season the cuckoo is said to love. The speaker at once adds ‘And so do I’, joining his own feelings to nature’s and giving the poem a warm, personal tone. This refrain, repeated in both stanzas, makes the poem feel like a song."],
[["When showers betumble the chestnut spikes,","And nestlings fly;"],"Gentle spring showers tumble over the spiky chestnut buds and refresh the trees. At the same moment young birds leave their nests and fly for the first time, showing new life beginning. The word ‘betumble’ makes the rain feel playful rather than harsh."],
[["And the little brown nightingale bills his best,","And they sit outside at ‘The Traveller’s Rest,’"],"The little brown nightingale sings its sweetest song and fills the air with music. People are no longer shut indoors; they sit outside at the inn called ‘The Traveller’s Rest’ and enjoy the weather together. Nature’s joy spreads to human company."],
[["And maids come forth sprig-muslin drest,","And citizens dream of the south and west,"],"Young women appear in light, flowery muslin dresses, a sign that the weather is warm. Meanwhile townspeople dream of escaping to the sunny south and west, where English holiday resorts lie. Spring lifts everyone’s spirits and makes them imagine pleasant journeys."],
[["And so do I."],"The refrain returns to close the stanza. The speaker confirms that he, like the cuckoo, the birds and the people, is happy in spring. The repetition makes the joy seem complete and shared by all."]],
v:[["showers","a brief, light fall of rain"],["betumble","to tumble about; throw into disorder"],["nestlings","baby birds"],["bills","sings"],["maids","young women"],["sprig-muslin","light cotton cloth with a floral pattern"]]},
{t:"Stanza 2 · The Severity of Winter",sum:"Stanza 2 shows winter as a time of hardship and gloom. The shepherd avoids the weather, beeches drip in dull browns, water throbs down the hillsides, streams overflow, drops hang on gate bars and rooks hurry home. Nature withdraws to survive, and the speaker shares this discomfort, so winter symbolises adversity, decay, isolation and decline.",sym:"Winter = adversity, decay, hardship, isolation and decline.",
pairs:[[["This is the weather the shepherd shuns,","And so do I;"],"The mood changes at once: this is the weather the shepherd shuns. Since he works outdoors with his flock, he suffers most from the cold and wet. The speaker’s ‘And so do I’ now expresses dislike, so the same refrain carries the opposite feeling."],
[["When beeches drip in browns and duns,","And thresh and ply;"],"Beech trees drip with rain, their leaves faded to dull browns and greyish ‘duns’. Wind and rain thresh and beat against them, like grain being threshed. The bright colours of spring have vanished, leaving a bleak, tired landscape."],
[["And hill-hid tides throb, throe on throe,","And meadow rivulets overflow,"],"Heavy rain gathers on the hills and rushes down in pulses, which Hardy describes as ‘throb, throe on throe’, like waves of pain. The little meadow streams cannot hold so much water and overflow. Nature seems restless and overwhelmed."],
[["And drops on gate bars hang in a row,","And rooks in families homeward go,"],"Raindrops hang in a neat row on the bars of the gate, a still, cold image of damp and waiting. Overhead, rooks fly home in family groups to find shelter. Even the birds retreat to safety, showing how harsh winter is for every living thing."],
[["And so do I."],"The final refrain shows that the speaker also dislikes the cold, wet weather and, like the shepherd and the rooks, longs for shelter. The repeated line unites man, bird and shepherd in one feeling and brings the poem to a balanced close."]],
v:[["shuns","dislikes / avoids"],["duns","a dull greyish-brown colour"],["throb","beat with a strong, regular rhythm"],["rivulets","small rivers / streams"],["rooks","large black crow-like birds"]]}];
const VQ=[["showers","a brief and usually light fall of rain"],["bills","sings"],["maids","young women"],["betumble","to tumble about; throw into disorder"],["nestlings","baby birds"],["shuns","dislikes / avoids"],["duns","a dull greyish-brown colour"],["throb","beat with a strong, regular rhythm"],["rivulets","small rivers / streams"]];
const mk=(q,c,...d)=>{const o=shf([c,...d]);return{q,o,a:o.indexOf(c)}};
const VI=VQ.map(([w,m])=>mk("“"+m[0].toUpperCase()+m.slice(1)+"” means…",w,...shf(VQ.filter(x=>x[0]!=w)).slice(0,3).map(x=>x[0])));
const FI=[mk("The poem ‘Weathers’ was written by ___.","Thomas Hardy","William Wordsworth","Robert Frost"),mk("In spring, light ___ fall on the chestnut buds.","showers","snowflakes","hailstones"),mk("The nightingale ‘___ his best’.","bills","shuns","throbs"),mk("People sit outside ‘The Traveller’s ___’.","Rest","Inn","Home"),mk("Citizens dream of the south and ___.","west","east","north"),mk("The ___ shuns the winter weather.","shepherd","farmer","cuckoo"),mk("Beeches drip in browns and ___.","duns","greens","golds"),mk("Rooks fly ___ in families.","homeward","southward","upward"),mk("The refrain of the poem is ‘And so do ___.’","I","we","they")];
const QA=[{q:'What do the nestlings do in the spring?',h:'Think of baby birds while gentle rain falls on the chestnut trees.',a:'In spring, the nestlings take their very first flights. As gentle showers fall on the chestnut buds, the young birds leave their nests and try their wings, showing the new life that spring brings.',alt:'The newly hatched birds venture out of their nests and begin to fly while light rain freshens the trees around them.',ev:'Evidence – ‘When showers betumble the chestnut spikes, / And nestlings fly;’ – the verb ‘fly’ marks their first flight, a symbol of growth and fresh beginnings.'},{q:'What does the nightingale do?',h:'Look at the phrase ‘bills his best’.',a:'The nightingale sings its sweetest and most beautiful song. Hardy says it ‘bills his best’, meaning the little brown bird gives its finest performance and fills the spring air with joy.',alt:'In the pleasant weather the small brown bird pours out its loveliest tune, adding music to the cheerful season.',ev:'Evidence – ‘And the little brown nightingale bills his best’ – ‘bills’ means sings, and the alliteration of ‘bills his best’ makes the line itself sound musical.'},{q:'How do the girls come out in spring?',h:'The poet mentions ‘sprig-muslin’, a light cloth.',a:'The girls come out wearing light, flowery cotton dresses (‘sprig-muslin drest’). Such thin clothes are possible only in warm weather, so their dress shows how pleasant and cheerful spring is.',alt:'Young women step outdoors in delicate floral frocks, glad to leave heavy winter clothes behind.',ev:'Evidence – ‘And maids come forth sprig-muslin drest’ – ‘maids’ means young women and ‘sprig-muslin’ is light cotton cloth patterned with small flowers.'},{q:'What plan do people make?',h:'Where does an English person go on a sunny holiday?',a:'People plan holidays in the warm south and west of England. The townspeople daydream about sunny coastal resorts where they can relax once the winter is over.',alt:'Citizens imagine escaping to seaside towns in the sunny south and west for a summer break.',ev:'Evidence – ‘And citizens dream of the south and west’ – to an English reader these regions mean coastal holiday destinations with warm weather and amusements.'},{q:'What happens to beeches in winter?',h:'Remember the colours ‘browns and duns’.',a:'In winter the beech trees stand drenched and dull. Their leaves turn dry, brown and grey (‘browns and duns’), and wind and rain beat against them, so they drip constantly.',alt:'The beeches lose their bright green and look faded, soaked and battered by the weather.',ev:'Evidence – ‘When beeches drip in browns and duns, / And thresh and ply;’ – ‘thresh’ shows the wind and rain beating the trees, and ‘duns’ gives their dull colour.'},{q:'Where do rooks go? Why do they go home?',h:'They travel in families to find shelter.',a:'The rooks fly home to their nests in family groups. As winter grows harsher with cold and heavy rain, they seek shelter and warmth together.',alt:'Rooks head back to their nests together, escaping the rain and the cold.',ev:'Evidence – ‘And rooks in families homeward go’ – even the birds retreat to safety, which shows how severe winter is for all living things.'},{q:'Does the poet enjoy the winter or the spring? Why?',h:'Compare warmth and birdsong with cold and rain.',a:'The poet enjoys spring. It brings warmth, singing birds, fresh greenery and a cheerful social mood, whereas winter is cold, wet and gloomy, with heavy rain, overflowing streams and dripping trees. The refrain ‘And so do I’ shows he shares the feelings of the cuckoo in spring and of the shepherd in winter.',alt:'Spring delights him as a time of life, music and company; winter depresses him as a time of cold, damp and hardship.',ev:'Evidence – Stanza 1: ‘This is the weather the cuckoo likes, / And so do I’; Stanza 2: ‘This is the weather the shepherd shuns, / And so do I’ – the same refrain expresses love for spring and dislike of winter.'}];
const RH=[["likes","A","shuns","A"],["I","B","I","B"],["spikes","A","duns","A"],["fly","B","ply","B"],["best","C","throe","C"],["Rest","D","overflow","D"],["drest","D","row","D"],["west","E","go","E"],["I","B","I","B"]];
const RC={A:"#f9cdb5",B:"#bfe5d0",C:"#cbdcf7",D:"#f5e6a8",E:"#e5c9f0"};
const DV=[["y","Refrain","‘And so do I’ appears in line 2 and again as the closing line of both stanzas. It gives the poem a song-like cadence and links the speaker with nature."],["y","Anaphora & Polysyndeton","Almost every line from line 4 onward begins with ‘And’ (‘And nestlings fly… And they sit outside… And maids come forth…’). The piled-up ‘and’s create a flowing, list-like rhythm that makes spring and winter seem full of many small details."],["y","Contrast (Antithesis)","The whole poem rests on contrast: spring vs winter, cuckoo ‘likes’ vs shepherd ‘shuns’, people coming out (‘maids come forth’) vs rooks going in (‘homeward go’), bright florals vs ‘browns and duns’, joy vs gloom."],["y","Imagery","Visual: ‘sprig-muslin drest’, ‘beeches drip in browns and duns’, ‘drops on gate bars hang in a row’. Auditory: ‘nightingale bills his best’, ‘tides throb’."],["y","Symbolism","Spring stands for youth, hope and happiness; winter for hardship, decay and decline. Together the ‘weathers’ symbolise the bright and dark phases of life."],["y","Alliteration","‘bills his best’ (b), ‘hill-hid’ (h), ‘throb, throe on throe’ (th). These repeated sounds add music to the lines."],["y","Poetic Diction","Hardy uses coined and compound words such as ‘betumble’, ‘hill-hid’ and ‘sprig-muslin’, and old-fashioned words like ‘maids’, ‘bills’ (sings) and ‘drest’, giving the poem a rustic, timeless flavour."],["s","Personification","Present only lightly. The showers ‘betumble’ the chestnut buds as if playing, the hill-hid tides ‘throb’ like a living pulse, and the cuckoo ‘likes’ the weather as a person would. Nature is not given full human actions, so it is not a major device here."],["s","Anthropomorphism","Very mild. Human feelings are given to creatures only in the cuckoo ‘liking’ spring and the rooks going home ‘in families’. The poem does not make animals speak or think like humans."],["s","Pathetic Fallacy","Weather mirrors mood: sunny, lively spring matches cheerful people, while cold, dripping winter matches gloom and the urge to find shelter."],["s","Onomatopoeia (sound effect)","‘Throb’ and the repeated ‘throe on throe’ imitate the heavy, pulsing rush of water. It is a gentle sound effect rather than a clear, classic onomatopoeic word."],["y","Tone & Mood","Stanza 1: cheerful, lively, warm and social. Stanza 2: gloomy, cold, heavy and restrictive."],["n","Simile, Metaphor, Hyperbole","Not used. There is no ‘like/as’ comparison, no direct metaphor and no exaggeration. Hardy compares the two seasons by contrast and symbol instead of by direct comparison."]];
const stz=k=>{const s=ST[k];return`<div class="w"><h2 class="r">${s.t}</h2><div class="r"><button class="btn" onclick="tv(this)">Vocabulary</button><button class="btn p" onclick="nx(this)">Explain next line ▶</button><button class="btn g" onclick="rs(this)">↺ Reset</button></div><div class="vg">${s.v.map(([a,b],i)=>`<div class="vc" style="--i:${i}"><b>${a}</b><span>${b}</span></div>`).join("")}</div><div class="poem">${s.pairs.map(([l,e])=>`<div class="pr r"><div class="ln">${l.join("<br>")}</div><div class="ex">${e}</div></div>`).join("")}</div><div class="sm"><b>Stanza summary:</b> ${s.sum}</div></div>`};
const mcq=(it,t,n)=>`<div class="w"><h2 class="r">${t}<span class="sc">Score 0 / ${it.length}</span></h2><p class="r">${n}</p>${it.map((x,i)=>`<div class="card q r" data-a="${x.a}"><p><b>${i+1}.</b> ${x.q}</p><div class="os">${x.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><div class="fb"></div></div>`).join("")}</div>`;
const SL=[
["","Start",`<div class="w hero"><div class="orn"></div><h1 class="r">Weathers</h1><p class="r" style="font-size:20px">by <b>Thomas Hardy</b> · Class 10 English</p><button class="btn p r" style="font-size:18px" onclick="go(1)">Begin the journey →</button><p class="r" style="color:var(--mut)">Use ← → keys, swipe, or the dots below</p></div>`],
["","Warm-up",`<div class="w"><h2 class="r">Pre-Reading Warm-Up</h2><p class="r">Tap each picture to reveal what it shows.</p><div class="g2"><div class="card dv r" style="background:var(--wil)" onclick="this.classList.toggle('f')"><i></i><h3>Picture 1 · Winter</h3><p>Bare branches, snow-covered ground, a cold and gloomy atmosphere.</p></div><div class="card dv r" style="background:var(--spl)" onclick="this.classList.toggle('f')"><i></i><h3>Picture 2 · Spring</h3><p>Lush green foliage, singing birds, bright sunlight and a vibrant mood.</p></div></div><div class="card r"><b>Key difference:</b> Picture 1 is cold and bleak, with nature dormant under frost. Picture 2 is warm and energetic, full of greenery and active wildlife.</div></div>`],
["","Poet & Title",`<div class="w"><h2 class="r">The Poet & the Title</h2><div class="g2"><div class="card r"><h3>Thomas Hardy (1840–1928)</h3><p>Victorian novelist and poet from Dorset, England, famed for <i>Tess of the d’Urbervilles</i> and <i>Far from the Madding Crowd</i>. Later he turned to poetry, known for vivid Wessex landscapes, sensitivity to nature, precise rhythm and deep reflections on emotion and time.</p></div><div class="card r"><h3>Why “Weathers”?</h3><p>The plural title signals two contrasting states of nature – spring and winter.</p><button class="btn p" onclick="this.nextElementSibling.classList.add('sh');this.remove()">Reveal deeper meaning</button><div class="rv hint">The two ‘weathers’ mirror the bright and dark phases of human life, showing how moods and activities change with nature.</div></div></div></div>`],
["sp","Stanza 1",stz(0)],["wi","Stanza 2",stz(1)],
["","Summary",`<div class="w"><h2 class="r">Summary of the Poem</h2><p class="r">Every line is now explained, so here is the whole poem in one view. Hardy shows how nature shapes the routines, moods and survival of animals and humans alike.</p><div class="r"><button class="pill on" onclick="sw(0,this)">Spring</button><button class="pill" onclick="sw(1,this)">Winter</button></div><div class="card" id="sb"></div></div>`],
["","Lyric & Rhyme",`<div class="w"><h2 class="r">Lyric Poem & Structure</h2><div class="card r"><h3>What is a lyric poem?</h3><p>A lyric poem is a short poem in which a single speaker expresses personal feelings, thoughts and observations in a musical, song-like way. The name comes from the ‘lyre’, the instrument that once accompanied such verses. It does not tell a story; it paints a mood.</p><p><b>Why ‘Weathers’ is a lyric:</b> the speaker says ‘I’, reveals how he feels about spring and winter, and uses a repeating refrain and a fixed rhyme pattern that give the poem a singing quality.</p></div><p class="r">Two 9-line stanzas · scheme <b>A B A B C D D E A</b>. Hover over a rhyme word to light up its partners.</p><div class="card r"><table class="rt"><tr><th>Line</th><th>Stanza 1</th><th>Stanza 2</th></tr>${RH.map((r,i)=>`<tr><td>${i+1}</td><td><span class="ch" data-l="${r[1]}" style="background:${RC[r[1]]}">${r[0]} (${i==8?"B/A":r[1]})</span></td><td><span class="ch" data-l="${r[3]}" style="background:${RC[r[3]]}">${r[2]} (${i==8?"B/A":r[3]})</span></td></tr>`).join("")}</table></div></div>`],
["","Devices",`<div class="w"><h2 class="r">Literary Devices & Tone</h2><p class="r">A full check of the poem: which devices Hardy clearly uses, which appear only lightly, and which are absent. Tap a card for the explanation.</p><div class="r"><button class="pill on" onclick="fl('a',this)">All</button><button class="pill" onclick="fl('y',this)">Used</button><button class="pill" onclick="fl('s',this)">Subtle</button><button class="pill" onclick="fl('n',this)">Not used</button></div><div class="g2" id="dg">${DV.map(d=>`<div class="card dv r" data-b="${d[0]}" onclick="this.classList.toggle('f')"><span class="bd ${d[0]}">${{y:"Used",s:"Subtle",n:"Not used"}[d[0]]}</span><h3>${d[1]}</h3><p>${d[2]}</p></div>`).join("")}</div></div>`],
["","Word Meanings",mcq(VI,"Word Meanings","Choose the word that matches each meaning.")],
