["Passage · Para 1–2 · pp. 257–258","Humble beginnings & vision","castle","1901 → 20th century",[["Paragraph 1","Opens with a reflective question: who comes to mind when we think of people who rose from poverty or modest backgrounds to achieve massive success? Walt Disney is introduced as the prime example of this ‘rags-to-riches’ journey."],["Paragraph 2","Highlights his global impact as an animator, filmmaker and theme park creator who transformed 20th-century entertainment. Then the tone shifts (‘Yet, dig a little deeper…’) to reveal that behind the magic lay an unhappy childhood and repeated business failures."]],[["humble (adj.)","Modest, poor, or low in social or financial status (‘humble beginnings’)."],["extraordinarily (adv.)","To a very great, remarkable or unusual degree."],["animator (noun)","An artist or filmmaker who creates animated cartoons or movies."],["countless (adj.)","Too many to be counted; innumerable."]]],
["Passage · Para 3 · p. 258","Troubled childhood & war service","studio","1901 → 1919",[["Family & hardship","Born in Chicago (1901) and raised in Missouri, Walt was the fourth of five children. His father, Elias Disney, was strict, controlling (domineering) and allegedly abusive, and he failed to earn enough money to support the family."],["Escape & early service","Young Walt found emotional comfort in drawing while he watched his older brothers run away from home one by one. At 16 he dropped out of school to join the Army, was rejected for being underage, and instead spent a year in France driving an ambulance for the Red Cross before returning to the US in 1919."]],[["siblings (noun)","Brothers or sisters."],["domineering (adj.)","Asserting one’s will over others in an arrogant, controlling way."],["abusive (adj.)","Treating someone with cruelty, violence or harshness."],["make ends meet (idiom)","To earn just enough money to pay for basic living expenses."],["solace (noun)","Comfort or consolation in a time of distress or sadness."]]],
["Passage · Para 4–5 · p. 258","First bankruptcy & Oswald the Rabbit","studio","1919 → 1927",[["Paragraph 4 · First failure","After returning from the war, Disney worked as a trainee (apprentice) at a commercial art studio in Kansas City. Eager to start independently, he and his older brother Roy founded Laugh-O-Gram Studios in 1920, but the company ran out of money and went bankrupt within two years."],["Paragraph 5 · Fresh start & Oswald","With only $40 left, Walt moved to Los Angeles to try acting, where he failed again. But noticing California had no animation studios, he persuaded Roy to join him and open one there. Soon after, he achieved his first major hit with ‘Oswald the Lucky Rabbit’."]],[["apprentice (noun)","A person learning a trade or skill from a skilled employer; a trainee."],["itching (verb/adj.)","Feeling a strong, impatient desire to do something."],["set off (phrasal verb)","To begin a journey or start a new venture."],["bankrupt (adj.)","Declared in law as unable to pay debts; financially ruined."],["silver lining (idiom)","A sign of hope or positive aspect in an otherwise bad situation."],["animation (noun)","The technique of filming successive drawings to create an illusion of movement."]]],
["Passage · Para 6–7 · p. 259","Betrayal & the birth of Mickey Mouse","train","1928 → late 1920s",[["Paragraph 6 · Corporate betrayal","Though Oswald became a huge star, Disney’s luck turned when he went to New York to renegotiate his contract. His producer had secretly hired away his animation team and claimed legal ownership of Oswald. Rather than wasting energy on revenge, Disney walked away and conceived Mickey Mouse on the train ride back to California."],["Paragraph 7 · 300+ rejections","Living on beans and sinking deeper into debt, Disney finally launched Mickey Mouse in the late 1920s — but only after investors rejected the idea of a cartoon mouse over 300 times."]],[["renegotiate (verb)","To discuss the terms of an agreement or contract again in order to change them."],["plotting (verb)","Secretly planning or scheming to do something harmful or illegal."],["revenge (noun)","Hurting or harming someone in return for an injury or wrong suffered."]]],
["Passage · Para 8 · p. 259","Nervous breakdown & Snow White","castle","1930s → 1942",[["Mental health crisis","Despite Mickey’s popularity, keeping the studio financially alive was exhausting. Overwork and stress — worsened when his distributor stole his best longtime animator — caused Disney to suffer a nervous breakdown."],["Recovery & a risky film","After resting with his wife, Disney took a bold gamble: the first full-length animated feature, ‘Snow White and the Seven Dwarfs’ (1937). It was a massive box-office hit, but Pinocchio (1940), Fantasia (1940) and Bambi (1942) initially failed commercially — they were duds."]],[["afloat (adj./adv.)","Out of debt or financial difficulty; able to survive and keep operating."],["nervous breakdown (noun phrase)","A period of severe mental and emotional stress when a person cannot function normally."],["box office (noun)","The commercial success of a film measured by ticket sales."],["duds (noun)","Things that fail to work or meet expectations; commercial failures."]]],
["Passage · Para 9–10 · p. 259","WWII debt, the TV gamble & Disneyland","park","1940s → 1955",[["Paragraph 9 · WWII & the TV pivot","At the start of World War II his animators went on strike, pushing his debt past $4 million. Post-war recovery was slow, so Disney diversified into television — ignoring film studios that warned him to stay on the big screen. Hits like The Mickey Mouse Club and Davy Crockett generated the capital to fund his biggest dream: Disneyland."],["Paragraph 10 · Milestone","Disneyland officially opened on July 17, 1955, in Anaheim, California."]],[["mounting (adj.)","Gradually increasing, growing or accumulating."],["diversify (verb)","To expand into different products or areas to reduce risk."],["gamble (noun)","An action taken with risk, hoping for a major reward."],["harness (verb)","To control, gather and make use of (resources, capital or energy)."],["venture (noun)","A risky or daring business undertaking."]]],
["Passage · Para 11–12 · p. 260","Black Sunday & the philosophy of failure","park","July 17, 1955",[["Paragraph 11 · Black Sunday to colossal success","Opening day was a disaster dubbed ‘Black Sunday’ by critics: forged tickets created a 7-mile line, 100°F heat melted the fresh asphalt so high heels sank, drinking fountains didn’t work and rides broke down. Through perseverance Disney fixed the flaws, and the park became a massive success that wiped out his debts."],["Paragraph 12 · Closing quote","The passage ends with Disney’s reflection that every trouble, obstacle and ‘kick in the teeth’ strengthened him and proved essential to his eventual success."]],[["enterprises (noun)","Businesses, companies or bold projects."],["forged (adj.)","Copied fraudulently; fake or counterfeit."],["asphalt (noun)","A dark, tar-like substance mixed with gravel for paving roads."],["defunct (adj.)","No longer working, existing or functioning."],["perseverance (noun)","Continued effort despite difficulties, failure or opposition."],["endeavor (noun)","An attempt or serious effort to achieve a goal."],["colossal (adj.)","Extremely large, huge or immense."],["adversity (noun)","Difficulties, hardship or misfortune."],["kick in the teeth (idiom)","A severe setback, humiliation or cruel disappointment."]]]];
var X=[["The writer starts with a question: think of a famous person who began with almost nothing yet became hugely successful — who comes to mind? For many readers the answer is Walt Disney, and the passage will show why his story is the perfect example.", "The opening works like a hook. Instead of beginning with dates and facts, the writer speaks to you directly, which makes the topic personal. The phrase ‘humble beginnings’ prepares us for a rags-to-riches story. Paragraph 2 then lists what he became — animator, filmmaker and theme park developer — and says he ‘changed the entertainment world in the 20th century and beyond’, which shows both the size and the long life of his influence. The key turn is the sentence beginning ‘Yet, dig a little deeper…’. The word ‘Yet’ signals contrast: behind the glamorous image lie an unhappy childhood and countless business failures and setbacks. This contrast between outer success and hidden struggle is the heart of the whole passage.", "Remember: the unit title ‘struggle and success’ is introduced here. Exam tip: if asked about the tone of the opening, say it moves from admiration (his fame) to surprise (his hidden hardships)."], ["Walt grew up in a poor, unhappy home with a controlling father. He found comfort in drawing while his brothers left one by one. At 16 he tried to join the Army, was too young, and instead drove an ambulance for the Red Cross in France for a year.", "This paragraph gives the reasons behind Disney’s character. Born in Chicago in 1901 and raised in Missouri, he was the fourth of five sons. His father, Elias, is described as domineering — someone who forces his will on others — and allegedly abusive, and he was unable to earn enough to ‘make ends meet’. The older brothers escaped by running away, which left young Walt alone with the stress. His answer was not to run but to draw: drawing became his solace, a private place where he felt safe. Notice the irony — the activity that comforted him as a child later became his career. At 16 he dropped out of school, tried to join the Army and was rejected as underage. Instead of giving up, he joined the Red Cross and served a year in France, returning to the United States in 1919. Even at this age we see a pattern: when one door closes, he finds another.", "Key words: domineering, solace, make ends meet. Takeaway: difficult circumstances can shape talent and determination. Exam tip: a childhood question (Q a and b) is answered from this paragraph — mention poverty, a strict father, brothers running away and drawing as comfort."], ["After the war Walt worked as a trainee at a Kansas City art studio, then started his own cartoon company with his brother Roy. It failed within two years. With only $40 he went to Los Angeles to try acting, failed again, but then spotted a gap: no animation studios in California.", "This section shows Disney’s first major failure and how he recovered. As an apprentice he learned the trade while ‘itching’ — burning with impatience — to set off on his own. In 1920 he and Roy launched Laugh-O-Gram Studios, his first business, but it ran out of money and went bankrupt a couple of years later. Many people would have quit; Disney packed his bags, took just forty dollars and went to Los Angeles to try acting — and failed at that too. Then comes the ‘silver lining’: while looking around California he noticed there were no animation studios. He turned this gap into an opportunity, persuaded Roy to join him and set up a shop. Soon after he achieved his first major success with Oswald the Lucky Rabbit. The paragraph teaches that failure at one thing can reveal a better path, and that family support (Roy) matters.", "Key words: apprentice, bankrupt, silver lining. Takeaway: a failure is not the end — look for the opportunity it uncovers. Exam tip: Q c asks what he did after his first failure — mention the $40, Los Angeles, acting, Roy and the animation studio."], ["Oswald made Disney famous, but in New York he discovered his producer had taken his animators and owned the character. He chose not to take revenge. Instead, on the train home, he invented Mickey Mouse — which investors rejected over 300 times before one agreed.", "Here the story reaches its famous turning point. Oswald the Lucky Rabbit was a star, but Disney’s own luck ‘had run out’. Travelling to New York to renegotiate his contract, he learned that his producer had taken his team of animators and that he had no legal rights to his own creation. A different person might have spent years plotting revenge. Disney decided to walk away and start over, and it was on the train ride back to California that he created Mickey Mouse. The next paragraph shows how hard it was to turn the idea into reality: for years he ate beans and kept piling up debt, and investors rejected the concept of a cartoon mouse more than 300 times before one accepted it. Eventually Mickey came to life on film in the late 1920s and carried him back to the top of his industry.", "Key words: renegotiate, plotting, revenge. Takeaway: put your energy into building something new rather than into anger. Exam tip: Q d (How was Mickey Mouse created?) needs three points — betrayal in New York, walking away, the train ride."], ["Success brought pressure. Overwork and the loss of his best animator to his employer caused a nervous breakdown. After resting, Disney risked everything on the first full-length animated film, Snow White — a huge hit. But his next three films were commercial failures.", "This paragraph shows that success does not remove problems. Even with Mickey Mouse popular, keeping the business afloat was exhausting. He was overworked, and tensions with his employer — who eventually stole his longtime best animator — led to a nervous breakdown. After taking time off with his wife, he returned with ‘a bold new idea’: a full-length animated feature, Snow White and the Seven Dwarfs (1937). It became a huge success at the box office. Yet the films that followed — Pinocchio (1940), Fantasia (1940) and Bambi (1942) — ended up as duds, meaning commercial failures. The pattern is clear: big risks bring big rewards, but they also bring big disappointments, and a successful person must be able to keep going after both.", "Key words: afloat, nervous breakdown, box office, duds. Takeaway: rest and recovery are part of success; a hit does not guarantee the next one. Exam tip: Q e, f and g come from this paragraph — causes of the breakdown, the three duds, and Snow White."], ["During World War II his animators went on strike and his debt rose above four million dollars. Disney turned to television, ignoring advice to stay in film; shows like The Mickey Mouse Club and Davy Crockett paid off and gave him the money to build Disneyland, which opened on July 17, 1955.", "Problems kept growing: at the start of World War II his animators went on strike, and his ‘mounting’ debt ran past four million dollars. The company was slow to rebuild after the war, but this was the period when Disney learned to ‘diversify’ — to expand into a different kind of business. He turned to television even though the film studios pressured him to stay on the big screen. That was a gamble, and it paid off: with the success of The Mickey Mouse Club and Davy Crockett he was able to ‘harness’ enough capital — to gather and use it — to launch his biggest venture yet, Disneyland. Paragraph 10 is only one sentence but it carries the key date: Disneyland opened on July 17, 1955, in Anaheim, California. Notice how television, which looked like a distraction, became the bridge to his greatest dream.", "Key words: mounting, diversify, gamble, harness, venture. Takeaway: adapt to change and take calculated risks. Exam tip: remember the date and place (July 17, 1955, Anaheim) and the debt figure (over four million dollars)."], ["Opening day was a disaster nicknamed ‘Black Sunday’ — forged tickets, a seven-mile line, melting asphalt in 100°F heat, broken fountains and rides. Disney refused to give up; his perseverance turned the park into a colossal success that cleared his debts. He later said that adversity had strengthened him.", "The final paragraphs bring all the themes together. Like most of Disney’s enterprises, Disneyland got off to a rocky start. Forged tickets brought more visitors than expected, which created a line seven miles long. In temperatures up to 100 degrees, the new asphalt melted and women’s high heels sank into it, drinking fountains were defunct and some rides malfunctioned. Critics called the day ‘Black Sunday’. But, ‘as always’, his determination and perseverance turned his latest endeavor around: Disneyland became a colossal success, cleared his financial debts and is still an integral part of his business empire today. The passage ends with his own words about the benefits of failure: all the adversity, troubles and obstacles strengthened him, and a ‘kick in the teeth’ may be the best thing in the world for you. This quote is the central message of the lesson.", "Key words: forged, asphalt, defunct, perseverance, endeavor, colossal, adversity, kick in the teeth. Takeaway: failure, handled with courage, becomes a teacher. Exam tip: Q h needs the four problems; Q i and j need perseverance and the idea that failure strengthens us."]];

var D=[["How was Walt Disney’s childhood?","Look at Paragraph 2 & 3: was it happy or stressful? How did he cope?","Walt Disney’s childhood was unhappy, stressful and full of financial hardship. Growing up under a strict, domineering father in a poor family, he found comfort and escape in drawing.","Disney had a difficult and troubled childhood marked by poverty and a harsh, abusive father, which led him to seek solace in sketching while watching his older brothers run away from home."],
["Describe Disney’s family background.","Check Paragraph 3: birthplace, number of siblings, father’s name and behavior.","Walt Disney was born in Chicago in 1901 and raised in Missouri as the fourth son among five siblings. His father, Elias Disney, was a domineering and allegedly abusive man who struggled to earn enough money to support the family.","He came from a poor, large family with five children. Raised in Missouri by a strict, controlling father who failed to make ends meet, Disney grew up in an unstable home where his older brothers eventually ran away."],
["What did Disney do after his failure in the first business?","Check Paragraph 5: where did he go with $40, and who did he team up with?","After his first company (Laugh-O-Gram Studios) went bankrupt, Disney packed his bags with just forty dollars and moved to Los Angeles to try acting. When acting failed, he convinced his brother Roy to join him in California to open an animation studio, leading to Oswald the Lucky Rabbit.","Following his first bankruptcy, he traveled to Los Angeles with only $40 to pursue acting. After failing as an actor, he noticed there were no animation studios in California and partnered with Roy to set up a new cartoon studio."],
["How was the character of Mickey Mouse created?","Check Paragraph 6: what happened in New York, and where was he when he thought of Mickey?","After a New York producer stole his team of animators and took the legal rights to Oswald, Disney chose to walk away rather than seek revenge. On the train ride back to California, he conceived Mickey Mouse.","Mickey Mouse was born out of betrayal: Disney lost the rights and staff for Oswald in New York, and instead of giving up he invented Mickey during his train journey back to California."],
["Why did Disney have a mental breakdown?","Check Paragraph 8: two main causes — workload and betrayal by his employer.","Disney suffered a nervous breakdown because he was severely overworked while trying to keep his business afloat, combined with extreme stress from tensions with his employer, who stole his longtime best animator.","Heavy overwork, financial pressure and the emotional shock of having his best animator taken by his employer led to Disney’s nervous breakdown."],
["Which of his films were commercially useless?","Check the end of Paragraph 8: look for the three films listed as ‘duds’ (the textbook typo ‘inocchio’ = Pinocchio).","His full-length animated films Pinocchio (1940), Fantasia (1940) and Bambi (1942) were commercially unsuccessful (duds) on their initial release.","The three features that followed Snow White — Pinocchio (1940), Fantasia (1940) and Bambi (1942) — ended up as commercial duds."],
["Which films produced him great financial returns?","Check Paragraphs 6, 7 & 8: which character cartoons and which 1937 feature film were huge hits?","His early cartoons featuring Oswald the Lucky Rabbit and Mickey Mouse, along with his groundbreaking 1937 full-length film ‘Snow White and the Seven Dwarfs’, brought him great financial returns.","‘Snow White and the Seven Dwarfs’ (1937) was a massive box-office triumph, alongside his hugely popular Mickey Mouse and Oswald cartoon series."],
["Why do you think the opening of Disneyland was called ‘Black Sunday’?","Check Paragraph 11: list the four operational disasters on July 17, 1955.","It was called ‘Black Sunday’ because everything went wrong: counterfeit tickets caused a seven-mile-long crowd, 100-degree heat melted the fresh asphalt so high heels sank, drinking fountains failed and several rides malfunctioned.","Critics dubbed opening day ‘Black Sunday’ due to overcrowding from forged tickets, melting asphalt in 100°F heat, broken drinking fountains and malfunctioning rides."],
["What special quality of Disney made him finally a successful entrepreneur?","Check Paragraphs 9, 11 & 12: look at how he responded to failures and business risks.","Disney’s unwavering perseverance, determination, resilience in the face of failure and willingness to take bold creative and financial risks (such as full-length animation and television) made him a successful entrepreneur.","His extraordinary determination, adaptability and refusal to give up after repeated bankruptcies and rejections — turning every setback into motivation — made him a visionary entrepreneur."],
["What lesson do you learn from Disney’s life?","Check Paragraph 12: reflect on his quote about adversity and ‘a kick in the teeth’.","Failure and adversity are not the end of the road but stepping stones to success. With hard work, optimism and perseverance, anyone can overcome humble beginnings and repeated setbacks to achieve their dreams.","Disney’s journey teaches us never to surrender when faced with rejection or hardship; instead, obstacles strengthen our character and prepare us for greater achievements."]];
