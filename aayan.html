<script>

const quiz=(id,qs)=>{total[id]=qs.length;return qs.map((q,i)=>`<div class="q" data-s="${id}" data-i="${i}">${i+1}. ${q[0].replace('__','<span class="bl">______</span>')}<div class="ch">${q[1].map((x,j)=>`<button data-j="${j}">${x}</button>`).join('')}</div><div class="ex"></div></div>`).join('')+`<button class="btn" data-chk="${id}" style="margin-top:.8em">Check answers</button><span class="sc" id="sc${id}"></span>`};
const add=(tag,title,body,qs)=>{const id=S.length;if(qs)QS[id]=qs;S.push(`<section class="sl"><div class="in"><span class="tag">${tag}</span><h2>${title}</h2>${body}${qs?quiz(id,qs):''}</div></section>`)};
// [title, images, retold, explanation, vocab, blanks]
const P=[
["Life, Pain and Survival",[],"Jhamak says life is a beautiful flower of creation, but she cannot tell whether her own life belongs in that picture. Her heart cried while pain and laughter mixed. She survived a heavy life; the truth is bitter and the reality dull. Unlucky lines of fate were written for her at birth.","<b>Meaning:</b> She begins with a gentle idea (life is beautiful) and then doubts it for herself.<br><br><b>In detail:</b> ‘Whether my own life falls within my definition of life’ means she questions whether a life of pain still counts as the beautiful thing people praise. ‘Few will believe me’ shows how extreme her suffering was. She is not asking for pity; she is being honest that her experience is so far from the ordinary idea of life that readers may struggle to imagine it.<br><br><b>Literary touch:</b> Metaphor (life as a flower) and contrast (tears against laughter). Her book title, <i>Life: Thorn or Flower?</i>, grows from this idea.",[["insipid","lacking taste; dull"],["inscribed","wrote or carved words"]],[["Her reality was bitter and __ (dull, lacking taste).",["insipid","delightful","colourful"],0],["Unlucky lines of fate were __ for her at birth.",["inscribed","erased","praised"],0]]],
["The Sixth-Day Folk Belief",[],"On the sixth night after her birth, her mother bathed her and slipped an exercise book and a pen under her pillow. Folk belief said fortune would visit and write a good destiny. Her mother hoped, but fortune wrote no happy line.","<b>Meaning:</b> A family tradition shows a mother’s hope that fate would be kind.<br><br><b>In detail:</b> The exercise book and pen symbolise education and a bright future. The mother acts out of love even in a poor home. Jhamak speaks to her mother directly (‘Mother, you wanted…’), making the memory tender and sorrowful. Fortune is treated almost like a person who visits at night, which shows how strongly people trusted fate over effort.<br><br><b>Literary touch:</b> Irony. This girl later becomes a famous writer, so in a deeper sense the pen did bring fortune, though not as the belief expected.",[["fortune","luck or destiny"],["folk belief","a traditional popular belief"]],[["Her mother placed an exercise book and a __ under her pillow.",["pen","pencil","flower"],0],["People believed __ would write the line of fate.",["fortune","grandmother","nature"],0]]],
["Robbed by Fate",[],"She felt fate had robbed her of the sweetness and joy of life. She lived like an animal; the only difference was that she ate rice. Her life had no kind sympathy and no feelings of the human heart, and the pain was hard to bear.","<b>Meaning:</b> Her life felt empty and unseen.<br><br><b>In detail:</b> ‘Robbed by fate’ treats fate like a thief who stole her childhood joys. She was fed, but nobody shared her feelings, so she felt like a lifeless creature. ‘Invisible sympathies’ are kindnesses that cannot be seen but are deeply needed. The comparison also hints that she was cared for physically but left emotionally alone, and that being understood matters as much as being fed.<br><br><b>Literary touch:</b> Comparison between human and animal life; the idea of invisibility.",[["endure","bear patiently"],["sensations","physical or emotional feelings"]],[["The only difference between her life and an animal’s was that she ate __.",["rice","meat","fruit"],0],["‘Endure’ means to __ pain.",["bear","avoid","enjoy"],0]]],
["Cursed in Everyone’s Eyes",[],"Society saw her as cursed by the gods for sins of a past life. She was like a thorn pricking everyone’s eyes, and people met her with anger instead of sympathy. She asks how this could be right for a tender, innocent child.","<b>Meaning:</b> Society blamed a baby for her disability.<br><br><b>In detail:</b> Many people then believed in karma: disability meant punishment for a past sin, so even her neighbours looked at her with anger. Jhamak does not shout; she asks a quiet moral question that makes readers judge the society. The word ‘tender’ stresses that a baby cannot have sinned, so the belief itself is shown to be cruel and unfair.<br><br><b>Literary touch:</b> Metaphor (thorn in the eyes) and a rhetorical question.",[["pricked","pierced or hurt with a sharp point"]],[["People thought she was __ by the gods.",["cursed","blessed","rewarded"],0],["She called herself a __ that pricked everyone’s eyes.",["thorn","stone","flower"],0]]],
["Silent Suffering",[],"As a child she could not tell anyone her pain: no language, no gestures, no power to speak. The question ‘How am I to blame?’ stayed locked in her mind. Her breath felt tangled with life, and her life was suffocating, with no way out.","<b>Meaning:</b> The deepest pain was having questions but no voice.<br><br><b>In detail:</b> Children learn to express themselves through words, gestures and play; she had none, so thoughts piled up inside. She says that if there had been a way out, her life would have flowed like a river, an image of the freedom she could not reach. Because she could not speak, her suffering stayed hidden, and that silence made her loneliness even heavier.<br><br><b>Literary touch:</b> Breath and river imagery; repetition of ‘no’.",[["tangled","twisted together"],["suffocating","causing difficulty in breathing"]],[["She had no __ to express her feelings.",["medium","money","friend"],0],["‘Suffocating’ means causing difficulty in __.",["breathing","walking","seeing"],0]]],
["Nature and the Great Examples",["Helen_Keller:helen keller","Homer:homer statue","Nikolai_Ostrovsky:ostrovsky"],"She thanks Nature, who became her mother and wiped her tears. She argues that bodily weakness does not make a person incomplete. Homer, Nikolai Ostrovsky and Helen Keller were weak in body yet wrote history and left a new perspective.","<b>Meaning:</b> The turning point from self-pity to pride.<br><br><b>In detail:</b> Homer, the Greek poet, is traditionally said to have been blind. Ostrovsky, a Russian writer, and Helen Keller, an American author, overcame severe physical limits. Her argument: disability is not the same as being incomplete. By naming real people, she shows that strength of mind matters more than strength of body, and she begins to see herself as part of that company.<br><br><b>Literary touch:</b> Allusion to real famous people as proof.",[["perspective","a particular attitude or way of seeing"],["fostered","cared for and helped to grow"]],[["Jhamak compares herself with Homer, Ostrovsky and __.",["Helen Keller","Mother Teresa","Malala"],0],["‘Perspective’ means a particular __ towards something.",["attitude","weight","colour"],0]]],
["Awareness as a Curse",[],"She was born into a world and place very different from theirs, so her life was unequal and low grade. When consciousness began to sprout, she saw what she lacked: no voice, no strong legs, no strong hands. Her longings could never be fulfilled and fell on her wounded.","<b>Meaning:</b> Knowing your limits can hurt more than not knowing.<br><br><b>In detail:</b> ‘Different geography’ means a harsher social world with fewer chances than the famous people had. Godavari, makhmali and sunakhari are Nepali flowers; being unable to gather them shows how even small joys were out of reach. Her awareness is painful because it makes her compare herself with others, yet it is also the first step towards her later determination to write.<br><br><b>Literary touch:</b> Nature imagery (sprouting shoots) and a list of what she lacked.",[["consciousness","awareness"],["longed","wished strongly for something"]],[["Achieving awareness became a __ for her.",["curse","gift","game"],0],["Her desires would never be __.",["fulfilled","forgotten","shared"],0]]],
["Grandmother and Poverty",[],"She imagines how her grandmother must have longed to hear her first grandchild say ‘grandmother’, but Jhamak could not. The family was poor, and two meals a day were hard to manage. Her parents often went hungry, and her grandmother fed her while going without food herself.","<b>Meaning:</b> Poverty and disability together made life harder, but love continued.<br><br><b>In detail:</b> Jhamak feels guilty that her disability took away her grandmother’s dream. Yet the grandmother gave her own share of food and even woke at night to feed her. The writer still remembers the taste with joy. This shows that her memories of poverty are not only bitter; they are mixed with deep love and gratitude.<br><br><b>Literary touch:</b> Direct address to the grandmother, sensory memory, and the moon-like white-haired grandmother.",[["offspring","a person’s child or children"]],[["Managing __ meals a day was hard for her family.",["two","three","five"],0],["Grandmother went without __ so Jhamak could eat.",["food","sleep","money"],0]]],
["Gratitude to Grandmother",[],"Grandmother wrapped her in a torn petticoat and carried her in a bamboo basket. Thanks to her, Jhamak touched the colours of life and its beauty. Grandmother has died, which is her misfortune, but she still lives in the writer’s heart and mind.","<b>Meaning:</b> Pain is answered with love and memory.<br><br><b>In detail:</b> The torn petticoat and bamboo basket show poverty, but also care: the grandmother made a safe bed from whatever she had. ‘Your misfortune’ means grandmother cannot see the writer’s success, yet love does not disappear. The ending turns the whole text from complaint into thanks, which is why the grandmother is the emotional heart of the piece.<br><br><b>Theme of the whole text:</b> courage, gratitude and the value of every human life.",[["misfortune","bad luck"]],[["Grandmother carried her in a __ basket.",["bamboo","cane","plastic"],0],["Grandmother still lives in the writer’s __.",["heart and mind","house","village"],0]]]];
S.push(`<section class="sl"><div class="in"><div class="hero"><div><span class="tag">English 10 &nbsp;·&nbsp; Unit 15</span><h1>People<br>and Places</h1><p class="big" style="font-size:1.5em;font-style:italic;margin:.2em 0">Me at the Beginning of Life</p><p class="mu">Jhamak Ghimire &nbsp;·&nbsp; translated by Michael Hutt</p><p class="mu" style="font-size:.8em;margin-top:2em">Use ▶ / arrow keys or swipe &nbsp;·&nbsp; open the buttons under each paragraph &nbsp;·&nbsp; pictures need internet</p></div>${gal(["Jhamak_Ghimire:jhamak ghimire"])}</div></div></section>`);
add("Pre-reading","What does the unit title mean?",`<div class="row">${gal(["Lukla_Airport:lukla airport","Bhaktapur_Durbar_Square:bhaktapur"])}<div class="card txt"><b>People</b> = notable personalities (see the three portraits in your book). <b>Places</b> = famous places of Nepal: a mountain airstrip (looks like Lukla) and an old temple square (looks like Bhaktapur). Talk about them with friends first.</div></div>`,[["The unit ‘People and Places’ introduces famous __ and places.",["personalities","machines","animals"],0],["Pre-reading means activities __ the main text.",["before","after","instead of"],0],["The two photographs show places of __.",["Nepal","India","Japan"],0]]);
add("Reading I","Who is the person in the picture?",`<div class="row">${gal(["Jhamak_Ghimire:jhamak ghimire"])}<div class="card txt"><b>Jhamak Ghimire</b> is a famous Nepali writer. She wrote despite severe physical disability (she writes with her left foot). Her autobiography <i>Jivan Kanda Ki Phul</i> is the source of this text.</div></div>${kw(["author","autobiography","courage"])}`,[["Jhamak Ghimire is famous as a Nepali __.",["writer","pilot","singer"],0],["<i>Jivan Kanda Ki Phul</i> is her __.",["autobiography","dictionary","map"],0]]);
const pnl=(k,h)=>`<div class="pn card" data-k="${k}" hidden>${h}</div>`;
P.forEach((p,n)=>{const id=S.length;QS[id]=p[5];S.push(`<section class="sl"><div class="in${p[1].length?'':' c'}"><span class="tag">Paragraph ${n+1} of 9</span><h2>${p[0]}</h2>${p[1].length?`<div class="row">${gal(p[1])}<p class="card txt">${p[2]}</p></div>`:`<p class="card txt">${p[2]}</p>`}<div class="btns"><button class="btn" data-pn="e">Explanation</button><button class="btn" data-pn="v">Vocabulary</button><button class="btn" data-pn="q">Practice</button></div>${pnl('e',p[3])}${pnl('v',p[4].map(v=>`<span class="kw">${v[0]}</span> ${v[1]}`).join('<br>'))}${pnl('q',quiz(id,p[5]))}</div></section>`);
if(n==3)S.push(`<section class="sl"><div class="in"><span class="tag">Game 1</span><h2>Memory Match: words and meanings</h2><p class="mu">Flip two cards. Match each word with its meaning.</p><div class="mg" id="mg"></div><p class="sc" id="mgs"></p></div></section>`)});
const MW=[["insipid","lacking taste"],["inscribed","wrote words"],["tangled","twisted together"],["suffocating","hard to breathe"],["perspective","attitude to something"],["misfortune","bad luck"]];
const MID=S.findIndex(s=>s.includes('id="mg"'));total[MID]=6;
add("Exercise A","Find the words from the text",`<p class="mu">Choose the matching word.</p>`,[["__ : a person’s child or children",["offspring","fortune","misfortune"],0],["__ : wrote words",["inscribed","pricked","longed"],0],["__ : causing difficulty in breathing",["suffocating","insipid","perspective"],0]]);
add("Exercise B","Complete the sentences",``,[["‘Calm’ is opposite in meaning to __.",["restless","invisible","tangled"],0],["The phrase __ means ‘died’.",["passed away","longed for","taken care"],0],["The word __ means incapable of being seen.",["invisible","insipid","inscribed"],0],["‘Wish’ and __ are synonyms.",["longing","misfortune","fortune"],0],["The word __ means making dirty.",["soiling","bathing","fostering"],0]]);
const RF=[["Jhamak defines her life as a beautiful flower of creation.",0,"Book: p. 241, para 1 – she is unsure her own life fits."],["Fortune decides how our life will be, according to her.",1,"Book: p. 241, para 2 – the line of fate."],["The author was happy with her childhood.",0,"Book: p. 241, para 3 – life was a burden."],["People blamed Jhamak herself for her disability.",1,"Book: p. 241–242, para 4 – cursed for past sins."],["Homer was incomplete because he was physically incapable.",0,"Book: p. 242 – she says such people are not incomplete."],["Jhamak could make grandmother happy with her voice.",0,"Book: p. 242 – she had no voice."],["Her grandmother still looks after her.",0,"Book: p. 243 – grandmother is ‘not with me now’."]];

function rfA(v){clearTimeout(rf.t);const q=RF[rf.i],ok=v===q[1];if(ok)rf.s++;const m=document.getElementById('rfm');m.className='ex '+(ok?'ok':'no');m.textContent=(ok?'✓ Correct! ':v<0?'Time up. ':'✗ Wrong. ')+q[2];document.querySelectorAll('#rf .btn').forEach(b=>b.disabled=true);rf.i++;rf.t=setTimeout(()=>rfNext(),1800)}

const MQ=[["Why does Jhamak think her life was a burdensome life?","She thinks so because she was born with a disability and could neither speak nor walk. People treated her as cursed and showed no sympathy, so her life felt no better than an animal’s, and the pain was hard to endure.","Page 241. Paragraph 1 calls it a ‘burdensome life’, and paragraph 3 says it ‘had become hard to endure the pain’.","Use Point → Reason → Proof. Point: her life was a burden. Reasons: disability, no sympathy, no voice. Proof: the comparison with an animal who only ate rice. Write 3–4 sentences."],
["When does fortune draw a line of fate?","According to folk belief, fortune draws the line of fate on the sixth night after a baby is born.","Page 241, paragraph 2, first line: ‘On the sixth day after my birth…’.","Begin with the question words (‘Fortune draws the line of fate…’). Add one detail, such as the exercise book and pen under the pillow, for full marks."],
["How did people respond to her life? Was she happy with their behaviour?","People thought she was cursed by the gods for sins of a past life. They were angry and showed no sympathy. She was not happy; she was hurt and could only endure in silence.","Page 241, last paragraph, continuing to page 242: ‘cursed by the gods’ and ‘a thorn that pricked everyone’s eyes’.","Answer the two parts separately: first the people’s response, then ‘No, she was not happy because…’. Join with ‘but’ or ‘so’."],
["Who does Jhamak compare herself with? What made them different from Jhamak?","She compares herself with Homer, Nikolai Ostrovsky and Helen Keller. Like her they were weak in body, but they were born in a different world and geography, with more chances, and they wrote history.","Page 242: the paragraph beginning ‘Blessed Nature!’ and the next beginning ‘But me?’.","Write similarity first (weak in body), then difference (their world and chances) using ‘but’ or ‘whereas’. Name all three people."],
["Did achieving awareness become a curse for her? Why?","Yes. Awareness showed her what she lacked: a voice, strength to walk, hands to pick flowers. She could not change any of it, so her unfulfilled desires wounded her.","Page 242, paragraph beginning ‘But me?’: ‘even achieving awareness became like a curse’.","Start with ‘Yes’, then ‘because…’. Give two concrete things she could not do and end with the result (her desires were wounded)."],
["How does Jhamak picture her family’s economic condition during her childhood?","She pictures it as very poor. Managing two meals a day was hard, her parents often went hungry, and her grandmother went without food so Jhamak could eat.","Page 243, paragraph beginning ‘At that time the economic condition of our home…’.","List three facts in order (two meals, parents hungry, grandmother’s sacrifice) and join them with ‘moreover’ and ‘even’."]];

function loadGal(g){if(g.dataset.d)return;g.dataset.d=1;g.dataset.w.split('|').forEach(w=>{const[t,k]=w.split(':'),f=document.createElement('figure'),im=new Image();im.alt=t.replace(/_/g,' ');f.append(im);const c=document.createElement('figcaption');f.append(c);g.append(f);
const fb=()=>{im.onerror=()=>f.remove();im.src='https://loremflickr.com/800/600/'+encodeURIComponent(k||t);c.textContent='Photo: Flickr (CC)'};
fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t)).then(r=>r.json()).then(d=>{const u=d.thumbnail&&d.thumbnail.source;if(u){im.onerror=()=>{im.onerror=fb;im.src=u};im.src=u.replace(/\/\d+px-/,'/960px-');c.textContent=d.title+' · Wikipedia'}else fb()}).catch(fb)})}
