<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Safety &amp; Security — Q&amp;A Review</title>
<style>
  :root{
    --ink:#0E1E2B;
    --navy:#10233B;
    --panel:#14314B;
    --paper:#EAF1F1;
    --teal:#2FB6A6;
    --teal-dim:#1D6E67;
    --amber:#E0A63A;
    --line:rgba(234,241,241,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(47,182,166,0.10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(224,166,58,0.08), transparent 40%),
      var(--navy);
    color:var(--paper);
    font-family:"Times New Roman", Times, serif;
    min-height:100vh;
    padding:56px 20px 100px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  /* header */
  header{margin-bottom:52px;position:relative;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:14px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--teal);border:1px solid var(--teal-dim);
    padding:6px 14px;border-radius:2px;background:rgba(47,182,166,0.06);
  }
  h1{
    font-size:44px;margin:22px 0 6px;font-weight:700;
    line-height:1.08;color:#fff;
  }
  .sub{font-size:20px;color:rgba(234,241,241,0.7);font-style:italic;}
  .progress-row{
    display:flex;align-items:center;gap:14px;margin-top:30px;
  }
  .progress-track{
    flex:1;height:8px;background:rgba(234,241,241,0.12);
    border-radius:99px;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--amber));
    transition:width .5s ease;
  }
  .progress-label{font-size:16px;color:var(--teal);white-space:nowrap;}

  /* lock icon */
  .lock-badge{
    position:absolute; top:0; right:0;
    width:74px;height:86px;
  }

  /* cards */
  .card{
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    border-radius:6px;
    padding:30px 32px 28px;
    margin-bottom:26px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--teal-dim);
  }
  .card.opened::before{background:var(--amber);}
  .qrow{display:flex;gap:18px;align-items:flex-start;}
  .qletter{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;
    border:2px solid var(--teal);color:var(--teal);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;
  }
  .qtext{font-size:23px;line-height:1.4;color:#fff;padding-top:4px;}

  .reveal-zone{margin-top:20px;margin-left:60px;}
  .stage{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .5s ease, opacity .4s ease, margin .4s ease;
  }
  .stage.show{max-height:400px;opacity:1;margin-top:16px;}

  .core-box{
    border:1px dashed var(--amber);
    background:rgba(224,166,58,0.07);
    padding:14px 18px;border-radius:4px;
  }
  .core-label{
    font-size:13px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--amber);margin-bottom:6px;font-style:normal;
  }
  .core-text{font-size:19px;color:#fdf3df;line-height:1.5;font-style:italic;}

  .answer-box{
    border-left:3px solid var(--teal);
    padding:6px 0 6px 18px;
  }
  .answer-label{
    font-size:13px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--teal);margin-bottom:6px;
  }
  .answer-text{font-size:20px;line-height:1.55;color:var(--paper);}
  .answer-text ol{margin:8px 0 0 20px;padding:0;}
  .answer-text li{margin-bottom:6px;}

  .btn-row{display:flex;gap:12px;margin-top:20px;margin-left:60px;flex-wrap:wrap;}
  button.reveal-btn{
    font-family:"Times New Roman", Times, serif;
    font-size:16px;letter-spacing:0.04em;
    background:transparent;color:var(--teal);
    border:1px solid var(--teal-dim);padding:10px 18px;border-radius:3px;
    cursor:pointer;transition:background .2s, color .2s, transform .1s;
  }
  button.reveal-btn:hover{background:var(--teal);color:var(--navy);}
  button.reveal-btn:active{transform:scale(0.97);}
  button.reveal-btn.secondary{border-color:var(--amber);color:var(--amber);}
  button.reveal-btn.secondary:hover{background:var(--amber);color:var(--navy);}
  button.reveal-btn[disabled]{opacity:0.35;cursor:default;}
  button.reveal-btn[disabled]:hover{background:transparent;color:var(--teal);}

  footer{
    max-width:900px;margin:40px auto 0;text-align:center;
    font-size:15px;color:rgba(234,241,241,0.45);
  }
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .toolbar button{
    font-family:"Times New Roman", Times, serif;font-size:15px;
    background:none;border:1px solid var(--line);color:rgba(234,241,241,0.7);
    padding:8px 16px;border-radius:3px;cursor:pointer;
  }
  .toolbar button:hover{border-color:var(--teal);color:var(--teal);}

  @media (max-width:600px){
    h1{font-size:32px;}
    .qtext{font-size:19px;}
    .reveal-zone,.btn-row{margin-left:0;}
    .lock-badge{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lock-badge" id="lockBadge"></div>
    <span class="eyebrow">English 10 · Page 113</span>
    <h1>Digital Safety &amp; Security</h1>
    <div class="sub">Questions &amp; Answers — unlock each answer one step at a time</div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 6 unlocked</div>
    </div>
  </header>

  <div class="toolbar">
    <button id="resetBtn" type="button">Reset all</button>
  </div>

  <div id="cards"></div>

  <footer>Click a question to think it through first — then unlock the core idea, then the full answer.</footer>
</div>

<script>
const data = [
  {
    letter: "a",
    q: "How do we try to protect our physical property?",
    core: "Physical asset protection through locking mechanisms and visual security systems.",
    answer: "We try to protect our physical property by taking practical security measures such as locking doors and windows, using bike locks, storing valuable possessions in a safe, and installing security alarms or surveillance cameras."
  },
  {
    letter: "b",
    q: "What should we do to keep our passwords secret?",
    core: "Password privacy via unique combination patterns, strict non-sharing, and secure digital management.",
    answer: "To keep our passwords secret and secure, we should create strong and unique password combinations for different accounts, avoid sharing them with anyone, never write them down in obvious places, and use a reliable password manager."
  },
  {
    letter: "c",
    q: "Mention any two safety measures for shopping with debit cards.",
    core: "Financial transaction safety through physical PIN concealment and verified digital encryption.",
    answerList: [
      "Shielding the keypad/PIN pad while entering your PIN during physical transactions.",
      "Ensuring the website is secure (checking for &lsquo;https://&rsquo; and a padlock icon) before providing financial details online."
    ]
  },
  {
    letter: "d",
    q: "How can we secure our accounts even when someone finds our password?",
    core: "Multi-layered account defense using secondary authentication tokens.",
    answer: "We can secure our accounts by enabling Two-Factor Authentication (2FA) or Multi-Factor Authentication (MFA). This requires a secondary verification step (such as an OTP sent to a mobile phone or an authenticator app code), preventing unauthorized access even if the password is compromised."
  },
  {
    letter: "e",
    q: "Why do you think we should make online friends only with familiar people?",
    core: "Social identity verification to prevent cyber threats, identity misuse, and online harassment.",
    answer: "We should make online friends only with people we know personally to minimize the risk of interacting with cybercriminals or scammers who might misuse our personal information, steal our identity, or engage in cyberbullying."
  },
  {
    letter: "f",
    q: "What can we do to keep our online data safe?",
    core: "Comprehensive cyber hygiene across network connections, software updates, and data encryption.",
    answer: "To keep our online data safe, we should avoid using unsecured public Wi-Fi networks, browse only encrypted and trusted websites, regularly update system software and applications, use strong passwords along with two-factor authentication, and backup critical data routinely."
  }
];

const cardsEl = document.getElementById("cards");
const state = data.map(() => ({core:false, answer:false}));

function render(){
  cardsEl.innerHTML = "";
  data.forEach((item, i) => {
    const s = state[i];
    const card = document.createElement("div");
    card.className = "card" + (s.answer ? " opened" : "");

    let answerHTML = "";
    if(item.answerList){
      answerHTML = "<ol>" + item.answerList.map(a => `<li>${a}</li>`).join("") + "</ol>";
    } else {
      answerHTML = `<p class="answer-text" style="margin:0;">${item.answer}</p>`;
    }

    card.innerHTML = `
      <div class="qrow">
        <div class="qletter">${item.letter}</div>
        <div class="qtext">${item.q}</div>
      </div>
      <div class="reveal-zone">
        <div class="stage ${s.core ? "show" : ""}">
          <div class="core-box">
            <div class="core-label">Core idea</div>
            <div class="core-text">${item.core}</div>
          </div>
        </div>
        <div class="stage ${s.answer ? "show" : ""}">
          <div class="answer-box">
            <div class="answer-label">Full answer</div>
            <div class="answer-text">${answerHTML}</div>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="reveal-btn" data-i="${i}" data-stage="core" ${s.core ? "disabled" : ""}>
          ${s.core ? "Core idea unlocked" : "Reveal core idea"}
        </button>
        <button class="reveal-btn secondary" data-i="${i}" data-stage="answer" ${!s.core ? "disabled" : ""} ${s.answer ? "disabled" : ""}>
          ${s.answer ? "Answer unlocked" : "Reveal full answer"}
        </button>
      </div>
    `;
    cardsEl.appendChild(card);
  });
  updateProgress();
  drawLock();
}

cardsEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button.reveal-btn");
  if(!btn || btn.disabled) return;
  const i = +btn.dataset.i;
  const stage = btn.dataset.stage;
  state[i][stage] = true;
  render();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  state.forEach(s => { s.core = false; s.answer = false; });
  render();
});

function updateProgress(){
  const unlocked = state.filter(s => s.answer).length;
  const pct = Math.round((unlocked / data.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = unlocked + " / " + data.length + " unlocked";
}

function drawLock(){
  const anyCore = state.some(s => s.core);
  const allDone = state.every(s => s.answer);
  const shackle = allDone ? -34 : (anyCore ? -14 : 0);
  const color = allDone ? "#2FB6A6" : (anyCore ? "#E0A63A" : "#5C7A86");
  document.getElementById("lockBadge").innerHTML = `
    <svg viewBox="0 0 74 86" width="74" height="86">
      <rect x="14" y="38" width="46" height="40" rx="6" fill="${color}" opacity="0.16" stroke="${color}" stroke-width="2.5"/>
      <circle cx="37" cy="58" r="5" fill="${color}"/>
      <rect x="35" y="58" width="4" height="12" fill="${color}"/>
      <path d="M22 38 V26 a15 15 0 0 1 30 0 V38" fill="none" stroke="${color}" stroke-width="4.5" stroke-linecap="round"
        transform="rotate(${shackle} 37 26)"/>
    </svg>
  `;
}

render();
</script>
</body>
</html>
