<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>

<title>Transmission of Digital Signal | Grade 10 ICT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme=aurora]{--bg:#070b17;--bg2:#10213d;--card:rgba(20,36,60,.72);--t:#f4f8ff;--m:#a9bad0;--a:#55eaff;--b:#50f0b0;--c:#b68cff;--o:#ffbc70;--ln:rgba(158,195,255,.18);color-scheme:dark}
[data-theme=sunset]{--bg:#150a14;--bg2:#3a1630;--card:rgba(66,26,52,.62);--t:#fff3ec;--m:#d8b8bd;--a:#ff9d5c;--b:#ffd166;--c:#ff6fa5;--o:#7be0d0;--ln:rgba(255,170,140,.22)}
[data-theme=paper]{--bg:#f3f6fc;--bg2:#d9e6fb;--card:rgba(255,255,255,.86);--t:#0f1b33;--m:#46566f;--a:#0a74cc;--b:#0a8f64;--c:#7447dc;--o:#cc6a0a;--ln:rgba(20,50,100,.16);color-scheme:light}
[data-theme=neon]{--bg:#05010f;--bg2:#241050;--card:rgba(34,12,68,.7);--t:#f6efff;--m:#bda9e0;--a:#00f5ff;--b:#ff2e97;--c:#b6ff3b;--o:#ffe600;--ln:rgba(200,120,255,.28)}
@media(prefers-color-scheme:light){:root:not([data-theme]){}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:Inter,"Segoe UI",Arial,sans-serif;transition:background .6s,color .6s}
body{background:radial-gradient(ellipse at 15% 15%,var(--bg2),transparent 55%),radial-gradient(ellipse at 90% 90%,color-mix(in srgb,var(--b) 14%,transparent),transparent 50%),var(--bg)}
:root{--e:cubic-bezier(.22,1,.36,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 16px var(--a);transition:width .8s var(--e);z-index:60}
.top{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:4%;right:4%;display:flex;justify-content:space-between;font:700 11px "Space Grotesk",sans-serif;letter-spacing:.2em;color:var(--m);z-index:40;pointer-events:none}
.top b{color:var(--a)}
.slide{position:absolute;inset:0;display:flex;padding:70px 7% 96px;opacity:0;visibility:hidden;transform:translateX(7%) scale(.97);filter:blur(8px);transition:opacity .7s var(--e),transform .9s var(--e),filter .7s,visibility .7s;overflow-y:auto;overflow-x:hidden;z-index:1;scrollbar-width:thin}
.slide.past{transform:translateX(-7%) scale(.97)}
.slide.on{opacity:1;visibility:visible;transform:none;filter:none}
.in{margin:auto;width:100%;max-width:1300px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--e),transform .8s var(--e);transition-delay:calc(var(--i,0)*.09s + .2s)}
.on .rv{opacity:1;transform:none}
.eb{display:flex;align-items:center;gap:10px;font:700 12px "Space Grotesk",sans-serif;letter-spacing:.24em;color:var(--a);text-transform:uppercase;margin-bottom:14px}
.eb:before{content:"";width:30px;height:2px;background:var(--a);box-shadow:0 0 10px var(--a)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
h1{font-size:clamp(44px,7.2vw,104px);line-height:.98;letter-spacing:-.05em;margin-bottom:22px}
h2{font-size:clamp(30px,4.2vw,58px);line-height:1.05;letter-spacing:-.035em;margin-bottom:12px}
h3{font-size:clamp(17px,1.8vw,22px);margin:10px 0 8px}
p{color:var(--m);line-height:1.65;font-size:clamp(14px,1.25vw,17px);margin:0 0 10px}
.gt{background:linear-gradient(100deg,var(--t) 0%,var(--a) 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.sub{max-width:680px;font-size:clamp(16px,1.6vw,21px)}
.glass,.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.18)}
.glass{padding:20px 24px}
.card{padding:20px;transition:transform .4s var(--e),border-color .4s,box-shadow .4s}
.card:hover{transform:translateY(-6px);border-color:var(--k,var(--a));box-shadow:0 18px 50px color-mix(in srgb,var(--k,var(--a)) 25%,transparent)}
.card p{font-size:14px;margin:0}
.g2,.g3{display:grid;gap:18px;margin-top:22px}
.g2{grid-template-columns:1fr 1fr;align-items:start}.g3{grid-template-columns:repeat(3,1fr)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--k,var(--a)) 16%,transparent);color:var(--k,var(--a));margin-bottom:10px;transition:transform .5s var(--e)}
.card:hover .ic{transform:rotate(-8deg) scale(1.12)}
.tag{display:inline-block;font:700 11px "Space Grotesk",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:99px;color:var(--k,var(--a));border:1px solid color-mix(in srgb,var(--k,var(--a)) 40%,transparent);background:color-mix(in srgb,var(--k,var(--a)) 9%,transparent)}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:11px 18px;font-weight:600;transition:transform .25s var(--e),background .25s,box-shadow .25s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--a) 28%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
.pri{background:linear-gradient(100deg,var(--a),var(--b));color:#04101c;border:0;font-weight:700}
.note{border-left:3px solid var(--k,var(--a));padding:2px 0 2px 14px;margin-top:16px}
.note p{margin:0;font-size:14px}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.art{position:relative;aspect-ratio:1;max-width:430px;margin:auto;width:100%}
.ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--a);opacity:.5;animation:spin 24s linear infinite}
.ring.r2{inset:12%;border-color:var(--b);animation-duration:16s;animation-direction:reverse}
.ring.r3{inset:26%;border:2px solid var(--c);opacity:.35;animation:pl 3s ease-in-out infinite}
.core{position:absolute;inset:36%;border-radius:50%;display:grid;place-items:center;font:700 44px "Space Grotesk";background:radial-gradient(circle,color-mix(in srgb,var(--a) 40%,transparent),color-mix(in srgb,var(--b) 14%,transparent));box-shadow:0 0 60px color-mix(in srgb,var(--a) 50%,transparent)}
.bit{position:absolute;font:600 14px monospace;color:var(--b);animation:fl 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pl{50%{transform:scale(1.12);opacity:.7}}@keyframes fl{50%{transform:translateY(-14px);opacity:.4}}
/* pipeline */
.pipe{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.node{flex:1;min-width:92px;text-align:center;padding:14px 6px;border-radius:16px;border:1px solid var(--ln);background:transparent;transition:all .4s var(--e)}
.node .ic{margin:0 auto 8px}.node strong{display:block;font-size:13px}
.node.sel{background:color-mix(in srgb,var(--k) 14%,transparent);border-color:var(--k);transform:translateY(-6px);box-shadow:0 12px 34px color-mix(in srgb,var(--k) 30%,transparent)}
.arr{color:var(--m);font-size:20px}
#detail{margin-top:18px;min-height:112px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
#form{font:700 20px "Space Grotesk";color:var(--k,var(--a));padding:14px 20px;border-radius:14px;border:1px dashed var(--k,var(--a));white-space:nowrap}
.pop{animation:pop .5s var(--e)}@keyframes pop{from{opacity:0;transform:translateY(12px)}}
#map{width:100%;height:auto;display:block}
.zl{font:700 12px "Space Grotesk",sans-serif;letter-spacing:.2em}
#road{fill:none;stroke:var(--ln);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
#flow{fill:none;stroke:var(--a);stroke-width:3;stroke-dasharray:3 14;stroke-linecap:round;opacity:.75;animation:fw 1s linear infinite}
@keyframes fw{to{stroke-dashoffset:-34}}
#trail{fill:none;stroke:var(--b);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.55;filter:drop-shadow(0 0 6px var(--b))}
.chv{fill:none;stroke:var(--m);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#pk{fill:var(--t);stroke:var(--a);stroke-width:3;filter:drop-shadow(0 0 8px var(--a))}
.mn{cursor:pointer;outline:none}
.mn .c{fill:color-mix(in srgb,var(--k) 14%,var(--bg2));stroke:var(--k);stroke-width:2;transition:all .4s var(--e)}
.mn:hover .c,.mn:focus-visible .c{stroke-width:4}
.mn.sel .c{fill:color-mix(in srgb,var(--k) 38%,var(--bg2));stroke-width:5;filter:drop-shadow(0 0 14px var(--k))}
.mn .em{font-size:30px;text-anchor:middle}
.mn .lb{fill:var(--t);font:700 15px "Space Grotesk",sans-serif;text-anchor:middle}
.mn .nb{fill:var(--bg);stroke:var(--k);stroke-width:2}
.mn .nt{fill:var(--t);font:700 12px "Space Grotesk",sans-serif;text-anchor:middle}
.nz{font-size:20px;animation:zap 1.2s ease-in-out infinite}@keyframes zap{50%{opacity:.25}}
/* canvases */
canvas.cv{width:100%;height:auto;border-radius:14px;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--ln);display:block}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--a)}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600;font-size:13px}.seg .act{background:var(--a);color:#04101c}
.bits{font:700 18px monospace;letter-spacing:.12em}.bits i{font-style:normal;padding:0 2px}.bits .bad{color:#ff5d73;text-decoration:underline}
/* mic */
.mic{width:96px;height:96px;border-radius:50%;border:2px solid var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);display:grid;place-items:center;font-size:40px;margin:14px auto;position:relative}
.mic.live{animation:ring 1.4s infinite;border-color:var(--b)}@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--b) 60%,transparent)}100%{box-shadow:0 0 0 28px transparent}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:10px;border-radius:12px;border:1px solid var(--ln);text-align:center}.stat small{display:block;font-size:10px;letter-spacing:.14em;color:var(--m)}.stat strong{font:700 19px "Space Grotesk"}
.byte{display:flex;gap:6px;justify-content:center;margin-top:8px}.byte span{width:30px;height:38px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--ln);font:700 16px monospace;transition:all .1s}.byte .h{background:var(--b);color:#04101c;box-shadow:0 0 14px var(--b)}
/* quiz */
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 18px}
.opt.ok{background:color-mix(in srgb,var(--b) 25%,transparent);border-color:var(--b)}.opt.no{background:rgba(255,93,115,.2);border-color:#ff5d73}
/* nav */
.nav{position:fixed;left:4%;right:4%;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:50}
.nav .l,.nav .r{display:flex;gap:8px}
.dots{display:flex;gap:7px}.dot{width:8px;height:8px;border-radius:9px;border:0;padding:0;background:var(--ln);transition:all .4s var(--e)}.dot.on{width:28px;background:var(--a);box-shadow:0 0 10px var(--a)}
#ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);z-index:80;padding:6% 7%;opacity:0;visibility:hidden;transition:.4s;overflow:auto}
#ov.on{opacity:1;visibility:visible}
#og{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}
.oi{text-align:left;padding:18px;border-radius:16px;border:1px solid var(--ln);background:var(--card);transition:transform .3s var(--e),border-color .3s}.oi:hover,.oi.cur{border-color:var(--a);transform:translateY(-4px)}.oi small{color:var(--a);letter-spacing:.14em;font-weight:700}.oi strong{display:block;margin-top:6px}
#toast{position:fixed;top:60px;left:50%;transform:translate(-50%,-20px);background:var(--card);border:1px solid var(--a);padding:8px 18px;border-radius:99px;opacity:0;transition:.4s var(--e);z-index:90;font-size:13px}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.hero,.g2,.g3{grid-template-columns:1fr}.art{max-width:240px}#detail{grid-template-columns:1fr}.arr{display:none}.nav .hint,.top b+*{display:none}.slide{padding:62px 5% 100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const card=(k,tag,h,p,ic)=>`<article class="card rv" style="--k:var(${k})"><div class="ic">${ic}</div><span class="tag">${tag}</span><h3>${h}</h3><p>${p}</p></article>`;
const P=[
["Source","🎙","--a","Original signal","The source creates the message: speech, typed text, a photo or sensor data. Analogue sources such as voice are first sampled into digital data.","∿ sound wave"],
["Encoder","▤","--c","Codes the data","Converts the information into a code, usually a sequence of bits (0s and 1s). Some systems also compress the data so fewer bits are sent.","0100 1000 1101"],
["Modulator","≈","--o","Shapes the signal","Changes a carrier wave so it can represent the bits and travel effectively through the medium (when modulation is needed).","carrier wave ≈"],
["Channel","🛰","--b","Transmission medium","Copper cables, fibre-optic cables or radio waves carry the signal to the receiver. Noise can disturb it on the way.","signal + noise"],
["Demodulator","≈","--o","Recovers the bits","Extracts the transmitted data from the modulated carrier signal and prepares it for decoding.","0100 1000 1101"],
["Decoder","▤","--c","Restores the data","Interprets the bit pattern and rebuilds the original information. Error checking may find or fix some mistakes.","message ✓"],
["Destination","🔊","--b","Final output","The person or device the message was meant for. The information appears as sound from a speaker or text on a screen.","“Hello!” heard"]];
const Q=[["Which part changes a carrier wave so data can travel through the channel?",["Decoder","Modulator","Source"],1,"The modulator prepares the data for the channel by changing a carrier wave."],
["What is “noise” in a communication channel?",["Unwanted interference that can change a signal","The sound of the speaker","The message itself"],0,"Noise comes from electrical equipment, other signals or the environment."],
["Why can digital signals be sent over long distances with good quality?",["They never have errors","Repeaters can regenerate them and errors can be detected","They don’t need a channel"],1,"Digital signals can be regenerated, but heavy interference can still cause errors."]];
const S=[
["Transmission of Digital Signal",`<div class="hero"><div><div class="eb rv">Grade 10 · Science &amp; Technology</div><h1 class="rv" style="--i:1">Transmission<br>of <span class="gt">Digital Signal.</span></h1><p class="sub rv" style="--i:2">How information is turned into data, carried through a channel, and rebuilt at its destination.</p><div class="row rv" style="--i:3;margin-top:26px"><button class="btn pri" onclick="go(1)">Start the journey ▶</button><span class="tag">Interactive · 9 slides</span></div><p class="rv" style="--i:4;font-size:12px;margin-top:14px">Tip: use ← → keys, swipe, or press O for overview, T for themes, F for fullscreen.</p></div>
<div class="art rv" style="--i:2"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core">01</div><span class="bit" style="top:6%;left:20%">101101</span><span class="bit" style="top:22%;right:0;animation-delay:-1s;color:var(--a)">010011</span><span class="bit" style="bottom:12%;left:2%;animation-delay:-2s;color:var(--a)">110010</span><span class="bit" style="bottom:4%;right:16%;animation-delay:-3s">001101</span></div></div>`],
["The Journey of a Signal",`<div class="eb rv">01 · The big picture</div><h2 class="rv">The journey of <span class="gt">a signal.</span></h2><p class="sub rv">Information moves through seven stages. Follow the arrows on the direction map. Tap any stage to explore it, or press Play to watch a message travel from sender to receiver.</p>
<div class="glass rv" style="margin-top:20px"><div id="mapw"></div><div id="detail" class="rv"></div><div class="row"><button class="btn pri" id="play">▶ Play the journey</button><span style="color:var(--m);font-size:13px">Source → Encoder → Modulator → Channel → Demodulator → Decoder → Destination</span></div></div>`],
["Preparing the Signal",`<div class="eb rv">02 · Transmitter side</div><h2 class="rv">Preparing the <span class="gt">signal.</span></h2><p class="sub rv">The transmitter gets the original information ready to travel.</p><div class="g3">
${card("--a","01 · Source","Original information","A person speaking, a typed message, a photo or sensor data. Analogue sources are converted to digital data first.","🎙")}${card("--c","02 · Encoder","Coder","Turns information into bits (0s and 1s). Some systems compress data to reduce the bits to send.","▤")}${card("--o","03 · Modulator","Signal modulation","Changes a carrier wave to represent the data so it travels well through the medium.","≈")}</div>
<div class="note rv"><p><b style="color:var(--a)">Real example · a voice message:</b> microphone → digital data → prepared for the network → carried by Wi-Fi or mobile data → decoded by the other phone → played from its speaker.</p></div>`],
["The Channel and Noise",`<div class="eb rv">03 · Transmission channel</div><h2 class="rv">The channel &amp; <span class="gt">noise.</span></h2><p class="sub rv">Drag the noise slider and compare how analogue and digital signals cope.</p>
<div class="g2"><div class="glass rv"><canvas class="cv" id="nz" width="900" height="260"></canvas><div class="row"><span style="font-size:13px;color:var(--m)">Noise</span><input type="range" id="amp" min="0" max="100" value="25"><b id="ampv">25%</b></div><div class="row"><div class="seg" id="mode"><button class="act" data-m="d">Digital</button><button data-m="a">Analogue</button></div><div class="bits" id="bitsOut"></div></div><p id="nzMsg" style="font-size:13px;margin:10px 0 0"></p></div>
<div>${card("--a","Channel","The transmission medium","The path that carries information: copper cables, fibre-optic cables or wireless radio waves.","📡")}<div style="height:14px"></div>${card("--o","Noise","Signal disturbance","Unwanted interference that can change or weaken a signal. It comes from electrical equipment, other radio signals or the environment.","⚡")}</div></div>`],
["Reconstructing the Signal",`<div class="eb rv">04 · Receiver side</div><h2 class="rv">Reconstructing the <span class="gt">signal.</span></h2><p class="sub rv">The receiver reverses the transmitter’s steps to recover the original information.</p><div class="g2">
${card("--o","05 · Demodulator","Recovering the signal","Extracts the transmitted data from the modulated carrier and prepares it for decoding.","≈")}${card("--c","06 · Decoder","Restoring the data","Interprets the bit pattern and rebuilds the original information. Error detection or correction may fix some mistakes. An output device then presents it.","▤")}</div>
<div class="note rv" style="--k:var(--b)"><p><b style="color:var(--b)">Mirror image:</b> Encoder ↔ Decoder and Modulator ↔ Demodulator. Every step at the sender is undone at the receiver.</p></div>`],
["Output and Advantages",`<div class="eb rv">05 · The result</div><h2 class="rv">Output &amp; advantages of <span class="gt">digital signals.</span></h2><div class="g3">
${card("--b","07 · Output","Destination","The person or device the message is meant for. The recovered data becomes sound, text or pictures.","🎯")}${card("--a","Advantage","Less affected by noise","Errors can often be detected and corrected, so small noise may not change the data.","🛡")}${card("--c","Advantage","Long distance","Repeaters regenerate digital signals along the route, keeping quality high.","🌍")}</div>
<div class="g2" style="margin-top:18px">${card("--o","Advantage","Easy storage","Digital data is easy to copy, search and store on SSDs, hard drives, USB drives and memory cards.","💾")}<div class="note rv" style="--k:var(--o);align-self:center"><p><b style="color:var(--o)">Remember:</b> digital doesn’t mean “no noise” or “no errors”. Weak signals and heavy interference can still interrupt transmission.</p></div></div>`],
["Uses of Digital Signals",`<div class="eb rv">06 · Real-world applications</div><h2 class="rv">Where do we use <span class="gt">digital signals?</span></h2><div class="g3">
${card("--a","Computing","Computers &amp; storage","Computers process digital data. SSDs, hard drives and USB drives store files as bits.","💻")}${card("--c","Personal","Personal devices","Phones, tablets, watches and cameras process and save photos, video and settings digitally.","📱")}${card("--b","Communication","Networks","Wi-Fi, Bluetooth, mobile networks and satellite links carry digital information.","📶")}${card("--o","Entertainment","Streaming &amp; TV","Streaming, digital TV and audio/video files deliver sound and pictures as data.","🎬")}${card("--c","Smart","Smart devices","Smart speakers, sensors and home systems exchange digital information to monitor and control.","🏠")}${card("--a","Health","Other equipment","Digital thermometers and medical monitors convert measurements into digital data.","🩺")}</div>`],
["Live Microphone Demonstration",`<div class="eb rv">07 · Live classroom demonstration</div><h2 class="rv">Your voice. <span class="gt">A digital journey.</span></h2><p class="sub rv">Speak and watch the sound wave. The bits below show one digital sample (0–255) of what the microphone hears. This visualises sound capture locally; it doesn’t send your voice anywhere.</p>
